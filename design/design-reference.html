<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable — design reference</title>
<!-- Static visual reference for the week view (1-hour gridlines). Not the app: no interactivity. -->
<style>
  :root {
    --bg: #0B0F1C;
    --text: #F4F6FB;
    --text-muted: rgba(244,246,251,0.66);
    --text-faint: rgba(244,246,251,0.55);
    --line: rgba(255,255,255,0.09);
    --col-line: rgba(255,255,255,0.06);
    --now: #FF5A4E;
    --high: 255,99,88;
    --medium: 255,184,76;
    --low: 92,168,255;
    --personal: 70,210,150;
    --hour: 72px;           /* 1 hour = 72px, 30 min snap = 36px */
    --gutter: 64px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; }
  .app { position: relative; width: 1440px; height: 900px; overflow: hidden; padding: 24px;
         display: flex; flex-direction: column; gap: 12px; }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .b1 { left:-120px; top:-160px; width:620px; height:620px; background: radial-gradient(circle, rgba(120,92,255,.55), rgba(120,92,255,0) 70%); }
  .b2 { right:-140px; bottom:-200px; width:720px; height:720px; background: radial-gradient(circle, rgba(32,190,190,.45), rgba(32,190,190,0) 70%); }
  .b3 { left:640px; top:380px; width:420px; height:420px; background: radial-gradient(circle, rgba(255,140,80,.30), rgba(255,140,80,0) 70%); }

  header { position: relative; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .title { display: flex; align-items: baseline; gap: 14px; }
  .title span { font-size: 15px; color: var(--text-muted); }
  .right { display: flex; align-items: center; gap: 18px; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: rgba(244,246,251,.78); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; }
  .seg { display: flex; height: 44px; border-radius: 22px; background: rgba(255,255,255,.08);
         border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
         backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .seg button { height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--text);
                font: inherit; font-size: 14px; font-weight: 600; padding: 0 10px; }
  .primary { height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.35);
             background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.14));
             box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.25);
             color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 0 18px; }

  .panel { position: relative; flex: 1; border-radius: 28px; background: rgba(255,255,255,.055);
           border: 1px solid rgba(255,255,255,.12);
           backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 30px 60px rgba(0,0,0,.35);
           padding: 0 16px 8px 0; display: flex; flex-direction: column; }
  .cols { display: grid; grid-template-columns: var(--gutter) repeat(7, minmax(0,1fr)); }
  .dayhead { height: 48px; align-items: center; }
  .dh { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .dh b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: rgba(244,246,251,.92); }
  .dh.today b { background: var(--now); color: #fff; }
  .body { position: relative; height: calc(var(--hour) * 10); }
  .gutter { position: relative; }
  .label { position: absolute; right: 12px; transform: translateY(-50%); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-faint); }
  .day { position: relative; border-left: 1px solid var(--col-line); }
  .day.today { background: rgba(255,255,255,.035); }
  .day.weekend { background: rgba(255,255,255,.015); }
  .line { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }

  /* Liquid-glass event card. --tint is an "r,g,b" triple from the importance colour. */
  .ev { position: absolute; left: 4px; right: 4px; border-radius: 14px; padding: 7px 10px; overflow: hidden;
        display: flex; flex-direction: column; gap: 2px; color: #fff;
        background: linear-gradient(180deg, rgba(var(--tint),.46), rgba(var(--tint),.26));
        border: 1px solid rgba(255,255,255,.28);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.25);
        backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); }
  .ev.selected { border-color: rgba(255,255,255,.75);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 0 3px rgba(var(--tint),.35), 0 14px 32px rgba(0,0,0,.4); }
  .ev .t { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; line-height: 16px; }
  .ev .t i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: rgb(var(--tint)); }
  .ev .t span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .time { font-size: 12px; line-height: 15px; color: rgba(255,255,255,.78); padding-left: 13px; font-variant-numeric: tabular-nums; }
  .handle { position: absolute; left: 50%; width: 28px; height: 4px; margin-left: -14px; border-radius: 2px; background: rgba(255,255,255,.9); }
  .now { position: absolute; left: -5px; right: 0; height: 2px; background: var(--now); box-shadow: 0 0 10px rgba(255,90,78,.7); }
  .now::before { content: ""; position: absolute; left: 0; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
</style>
</head>
<body>
<div class="app">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <header>
    <div class="title"><h1>October 2026</h1><span>Week 41 · 5–11 Oct</span></div>
    <div class="right">
      <div class="legend">
        <span><i style="background:rgb(var(--high))"></i>High</span>
        <span><i style="background:rgb(var(--medium))"></i>Medium</span>
        <span><i style="background:rgb(var(--low))"></i>Low</span>
        <span><i style="background:rgb(var(--personal))"></i>Personal</span>
      </div>
      <div class="seg"><button aria-label="Previous week">‹</button><button>Today</button><button aria-label="Next week">›</button></div>
      <button class="primary">+ New event</button>
    </div>
  </header>
  <div class="panel">
    <div class="cols dayhead" id="dayhead"><div></div></div>
    <div class="cols body" id="body"><div class="gutter" id="gutter"></div></div>
  </div>
</div>
<script>
  const HOUR = 72, START = 7, END = 17, TODAY = 4, NOW = 7 + 29/60;
  const pad = n => String(n).padStart(2, "0");
  const fmt = h => pad(Math.floor(h)) + ":" + pad(Math.round((h % 1) * 60));
  const repeatIcon = '<svg aria-label="Repeats" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.8"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>';
  const events = [
    ...[0,1,2,3,4].map(d => ({ d, s: 7.5, e: 8, t: "Morning review", c: "low", r: true })),
    { d:0, s:9,    e:11,   t:"Deep work", c:"medium" },
    { d:0, s:13,   e:14,   t:"LeetCode · graphs", c:"low" },
    { d:1, s:10,   e:11.5, t:"Interview · founding eng", c:"high" },
    { d:1, s:14,   e:16,   t:"Side project build", c:"personal" },
    { d:2, s:9,    e:10,   t:"Weekly planning", c:"medium", r:true },
    { d:2, s:11,   e:12.5, t:"Gym", c:"personal" },
    { d:2, s:14.5, e:16.5, t:"Take-home task", c:"high" },
    { d:3, s:9.5,  e:11,   t:"System design study", c:"low" },
    { d:3, s:13,   e:14.5, t:"Coffee chat", c:"medium" },
    { d:4, s:10,   e:12,   t:"Deep work", c:"medium", sel:true },
    { d:4, s:14,   e:15,   t:"Weekly review", c:"low", r:true },
    { d:5, s:10,   e:12.5, t:"Climbing", c:"personal" },
    { d:6, s:11,   e:12,   t:"Call home", c:"personal" },
  ];
  const names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const head = document.getElementById("dayhead"), body = document.getElementById("body"), gutter = document.getElementById("gutter");
  for (let h = START; h <= END; h++)
    gutter.insertAdjacentHTML("beforeend", `<div class="label" style="top:${(h-START)*HOUR}px">${pad(h)}:00</div>`);
  names.forEach((n, i) => {
    head.insertAdjacentHTML("beforeend", `<div class="dh${i===TODAY?" today":""}"><span>${n}</span><b>${5+i}</b></div>`);
    let html = "";
    for (let h = START+1; h < END; h++) html += `<div class="line" style="top:${(h-START)*HOUR}px"></div>`;
    for (const e of events.filter(e => e.d === i)) {
      const top = (e.s-START)*HOUR + 2, ht = (e.e-e.s)*HOUR - 4;
      html += `<div class="ev${e.sel?" selected":""}" style="--tint:var(--${e.c});top:${top}px;height:${ht}px">
        <div class="t"><i></i><span>${e.t}</span>${e.r ? repeatIcon : ""}</div>
        ${ht >= 50 ? `<div class="time">${fmt(e.s)}–${fmt(e.e)}</div>` : ""}
        ${e.sel ? '<span class="handle" style="top:4px"></span><span class="handle" style="bottom:4px"></span>' : ""}
      </div>`;
    }
    if (i === TODAY) html += `<div class="now" style="top:${(NOW-START)*HOUR}px"></div>`;
    body.insertAdjacentHTML("beforeend", `<div class="day${i===TODAY?" today":""}${i>4?" weekend":""}">${html}</div>`);
  });
</script>
</body>
</html>
