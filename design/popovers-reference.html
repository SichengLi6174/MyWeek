<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timetable — popover reference</title>
<!-- Static reference for the three popover states, laid over design-reference.html.
     Pick a state with ?screen=create | details | recurring -->
<style>
  :root { --high: 255,99,88; --medium: 255,184,76; --low: 92,168,255; --personal: 70,210,150; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0F1C; color: #F4F6FB; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; }
  .stage { position: relative; width: 1440px; height: 900px; overflow: hidden; }
  .stage iframe { position: absolute; inset: 0; width: 1440px; height: 900px; border: 0; pointer-events: none; }
  .screen { display: none; } .screen.on { display: block; }

  /* Popover glass — darker than event cards so form text stays legible over busy content */
  .pop { position: absolute; border-radius: 26px; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px;
         background: linear-gradient(180deg, rgba(44,50,74,.90), rgba(22,26,42,.93));
         border: 1px solid rgba(255,255,255,.18);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 30px 80px rgba(0,0,0,.55);
         backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); }
  .row { display: flex; gap: 14px; align-items: center; }
  .ico { width: 24px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: rgba(244,246,251,.6); }
  .well { height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.08);
          color: #F4F6FB; font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; }
  .iconbtn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: rgba(244,246,251,.78);
             display: flex; align-items: center; justify-content: center; }
  .primary { height: 44px; padding: 0 26px; border: 1px solid rgba(255,255,255,.6); border-radius: 22px;
             background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232,236,246,.9));
             box-shadow: inset 0 1px 0 #fff, 0 8px 22px rgba(0,0,0,.35); color: #0B0F1C; font: inherit; font-size: 14px; font-weight: 650; }
  .secondary { height: 44px; padding: 0 20px; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: rgba(255,255,255,.08);
               color: #F4F6FB; font: inherit; font-size: 14px; font-weight: 600; }
  .link { height: 44px; padding: 0 14px; border: 0; background: transparent; color: #9CC8FF; font: inherit; font-size: 14px; font-weight: 600; }
  .swatches { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
  .sw { height: 64px; border: 0; border-radius: 14px; background: transparent; color: #F4F6FB; font: inherit; font-size: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; }
  .sw.on { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
  .dot { width: 24px; height: 24px; border-radius: 50%; background: rgb(var(--c)); display: flex; align-items: center; justify-content: center; }
  .sw.on .dot { box-shadow: 0 0 0 3px rgba(var(--c),.35); }
  .menu { position: absolute; left: 38px; top: 50px; width: 290px; z-index: 5; padding: 6px; border-radius: 18px; display: flex; flex-direction: column;
          background: linear-gradient(180deg, rgba(52,58,84,.98), rgba(30,34,52,.99)); border: 1px solid rgba(255,255,255,.18);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 24px 60px rgba(0,0,0,.55); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
  .opt { height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .opt.on { background: rgba(255,255,255,.12); }
  .opt i { width: 16px; display: flex; }
  .ev { position: absolute; border-radius: 14px; padding: 7px 10px; display: flex; flex-direction: column; gap: 2px;
        background: linear-gradient(180deg, rgba(var(--c),.62), rgba(var(--c),.40)); border: 1px solid rgba(255,255,255,.75);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 3px rgba(var(--c),.35), 0 14px 32px rgba(0,0,0,.4);
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .ev b { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 16px; }
  .ev b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c)); }
  .ev span { font-size: 12px; line-height: 15px; color: rgba(255,255,255,.8); padding-left: 13px; font-variant-numeric: tabular-nums; }
  .radio { height: 48px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .radio.on { background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .radio input { width: 18px; height: 18px; margin: 0; accent-color: #5CA8FF; }
</style>
</head>
<body>
<div class="stage">
  <iframe src="design-reference.html" title="Week view" tabindex="-1"></iframe>

  <!-- 1. QUICK CREATE: after click/drag on an empty slot (Thu 11:30–12:30) -->
  <div class="screen" id="create">
    <div class="ev" style="--c:var(--medium); left:655px; top:475px; width:178px; height:68px"><b>(No title)</b><span>11:30–12:30</span></div>
    <div class="pop" style="left:852px; top:250px; width:404px">
      <div class="row" style="justify-content:space-between">
        <span style="width:36px; height:5px; border-radius:3px; background:rgba(255,255,255,.22); margin-left:4px"></span>
        <button class="iconbtn" aria-label="Close" style="margin-right:-10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <input aria-label="Event title" placeholder="Add title" style="height:54px; padding:0 14px; border-radius:14px; background:rgba(255,255,255,.07); color:#fff; font:inherit; font-size:21px; font-weight:600; outline:none; border:1px solid rgba(var(--medium),.85); box-shadow:0 0 0 3px rgba(var(--medium),.28)">
      <div class="row">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <button class="well">Thu 8 Oct</button>
        <button class="well" style="padding:0 12px">11:30</button><span style="opacity:.5">–</span><button class="well" style="padding:0 12px">12:30</button>
        <span style="font-size:12px; opacity:.55">1 hr</span>
      </div>
      <div class="row" style="position:relative">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></span>
        <button class="well">Does not repeat <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="menu" role="listbox" aria-label="Repeat">
          <div class="opt on"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></i>Does not repeat</div>
          <div class="opt"><i></i>Daily</div>
          <div class="opt"><i></i>Weekly on Thursday</div>
          <div class="opt"><i></i>Every weekday (Mon–Fri)</div>
        </div>
      </div>
      <div class="row" style="align-items:flex-start">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></span>
        <div class="swatches" role="radiogroup" aria-label="Importance">
          <button class="sw" style="--c:var(--high)"><span class="dot"></span>High</button>
          <button class="sw on" style="--c:var(--medium)"><span class="dot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B0F1C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>Medium</button>
          <button class="sw" style="--c:var(--low)"><span class="dot"></span>Low</button>
          <button class="sw" style="--c:var(--personal)"><span class="dot"></span>Personal</button>
        </div>
      </div>
      <div class="row">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
        <span class="well" style="flex:1; color:rgba(244,246,251,.45)">Add notes</span>
      </div>
      <div class="row" style="justify-content:space-between; margin-top:4px">
        <button class="link">More options</button><button class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- 2. EVENT DETAILS: click an existing event (Fri "Weekly review") -->
  <div class="screen" id="details">
    <div style="position:absolute; left:842px; top:653px; width:179px; height:70px; border-radius:15px; border:2px solid rgba(255,255,255,.85); box-shadow:0 0 0 4px rgba(var(--low),.35), 0 14px 32px rgba(0,0,0,.4)"></div>
    <div class="pop" style="left:1034px; top:470px; width:384px; padding-top:10px; gap:12px">
      <div class="row" style="justify-content:flex-end; gap:2px; margin-right:-8px">
        <button class="iconbtn" aria-label="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
        <button class="iconbtn" aria-label="Duplicate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button class="iconbtn" aria-label="Delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        <button class="iconbtn" aria-label="Close" style="background:rgba(255,255,255,.08)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="row" style="align-items:flex-start">
        <span style="width:24px; height:28px; display:flex; align-items:center; justify-content:center"><span style="width:16px; height:16px; border-radius:5px; background:rgb(var(--low)); box-shadow:0 0 0 3px rgba(var(--low),.3)"></span></span>
        <div style="display:flex; flex-direction:column; gap:4px">
          <h2 style="margin:0; font-size:22px; line-height:28px; font-weight:650">Weekly review</h2>
          <span style="font-size:14px; color:rgba(244,246,251,.75)">Friday, 9 October · 14:00 – 15:00</span>
        </div>
      </div>
      <div class="row" style="font-size:14px"><span class="ico" style="height:24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></span>Weekly on Friday</div>
      <div class="row" style="font-size:14px"><span class="ico" style="height:24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>[Notes for this event]</div>
      <div style="height:1px; background:rgba(255,255,255,.10)"></div>
      <div class="row">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></span>
        <button class="iconbtn" aria-label="High"><span class="dot" style="--c:var(--high); width:22px; height:22px"></span></button>
        <button class="iconbtn" aria-label="Medium"><span class="dot" style="--c:var(--medium); width:22px; height:22px"></span></button>
        <button class="iconbtn" aria-label="Low" style="background:rgba(255,255,255,.12)"><span class="dot" style="--c:var(--low); width:22px; height:22px; box-shadow:0 0 0 3px rgba(var(--low),.35)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B0F1C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></button>
        <button class="iconbtn" aria-label="Personal"><span class="dot" style="--c:var(--personal); width:22px; height:22px"></span></button>
        <span style="font-size:13px; opacity:.65">Low</span>
      </div>
    </div>
  </div>

  <!-- 3. RECURRING EDIT: after dragging a recurring event (Weekly review 14:00 → 15:00) -->
  <div class="screen" id="recurring">
    <div style="position:absolute; left:842px; top:655px; width:179px; height:68px; border-radius:14px; border:1.5px dashed rgba(255,255,255,.45); background:rgba(11,15,28,.55)"></div>
    <div class="ev" style="--c:var(--low); left:842px; top:727px; width:179px; height:68px"><b>Weekly review</b><span>15:00–16:00</span></div>
    <div style="position:absolute; inset:0; background:rgba(5,8,16,.42); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)"></div>
    <div class="pop" role="dialog" aria-label="Edit recurring event" style="left:520px; top:290px; width:400px; padding:24px; gap:18px; border-radius:28px">
      <div style="display:flex; flex-direction:column; gap:6px">
        <h2 style="margin:0; font-size:21px; font-weight:650">Edit recurring event</h2>
        <span style="font-size:14px; color:rgba(244,246,251,.7)">Weekly review moved to 15:00 – 16:00</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px">
        <label class="radio on"><input type="radio" name="scope" checked>This event</label>
        <label class="radio"><input type="radio" name="scope">This and following events</label>
        <label class="radio"><input type="radio" name="scope">All events</label>
      </div>
      <div class="row" style="justify-content:flex-end; gap:8px"><button class="secondary">Cancel</button><button class="primary" style="padding:0 28px">OK</button></div>
    </div>
  </div>
</div>
<script>
  const s = new URLSearchParams(location.search).get("screen") || "create";
  document.getElementById(s)?.classList.add("on");
</script>
</body>
</html>
